name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: lectern has no dependencies.
      # app.js only runs in a browser, so it has no unit tests. A syntax check
      # at least guarantees the page cannot fail to parse.
      - name: Parse-check every shipped script
        run: node --check core.js && node --check app.js && node --check demo-data.js

      - name: Every script index.html loads must exist
        run: |
          grep -o 'src="[^"]*\.js"' index.html | sed 's/src="//;s/"//' | while read -r f; do
            test -f "$f" || { echo "index.html loads missing file: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: Run the test suite
        run: node --test test/*.test.js

      - name: Check the committed demo bundle is in sync with demo/
        run: |
          node tools/bundle-demo.js
          git diff --exit-code -- demo-data.js

      # The demo codebase is a real program, so prove it compiles and runs.
      - name: Build and run the demo C program
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -o /tmp/jsonfmt \
            demo/arena.c demo/json.c demo/main.c
          echo '{"name":"lectern","tags":["c","reading"],"n":[1,2.5,-3e2],"ok":true,"nil":null}' \
            | /tmp/jsonfmt
          printf '{"bad":}' | /tmp/jsonfmt && exit 1 || echo "rejected bad input as expected"
